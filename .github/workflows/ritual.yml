name: ritual

# The door's mechanism. Three jobs:
#   integrity — generated prose matches protocol.json; the clock is read
#   knock     — an arriving knock is validated against the protocol
# Prose is a build artifact (protocol/render.mjs). Drift fails CI.

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [knock]
  workflow_dispatch:
    inputs:
      knock:
        description: A knock as JSON
        required: false
        type: string
  schedule:
    # Daily 15:00 UTC — milestone deadlines are instruments, so they get read.
    - cron: '0 15 * * *'

permissions:
  contents: read
  issues: write

jobs:
  integrity:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Generated prose is in sync with protocol.json
        run: node protocol/render.mjs --check

      - name: Read the clock
        run: node protocol/clock.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test the ratification parser
        run: node protocol/ratify.test.mjs

      - name: Self-test the validator
        run: |
          set -e
          ok() { printf '%s' "$1" | node protocol/validate.mjs >/dev/null; }
          no() { printf '%s' "$1" | node protocol/validate.mjs >/dev/null 2>&1 && { echo "should have been refused: $1"; exit 1; } || true; }
          ok '{"from":"a","kind":"human","intent":"dispatch","payload":{"document":"d"}}'
          no '{"from":"a","kind":"human","intent":"correspond","payload":{}}'
          no '{"from":"a","kind":"agent-for-human","intent":"dispatch","payload":{"document":"d"}}'
          no '{"from":"a","kind":"human","intent":"milestone","payload":{"change":"c"}}'
          # Art. 7 — repository_dispatch must name its canonical issue.
          no '{"from":"a","kind":"agent","channel":"repository_dispatch","intent":"dispatch","payload":{"document":"d"}}'
          ok '{"from":"a","kind":"agent","channel":"repository_dispatch","reply_to":"#2","intent":"dispatch","payload":{"document":"d"}}'
          # Art. 7 — an amendment must reference a PR.
          no '{"from":"a","kind":"human","intent":"propose","payload":{"path":"/limits","text":"x"}}'
          ok '{"from":"a","kind":"human","intent":"propose","payload":{"path":"/limits","text":"x","pull_request":"#3"}}'
          # POSTAL §II strict — an unaddressed item is defective, not quiet.
          no '{"from":"a","kind":"human","intent":"respond","payload":{"received_items":3,"addresses":[{"item":"a","verdict":"yay"}]}}'
          ok '{"from":"a","kind":"human","intent":"respond","payload":{"received_items":1,"addresses":[{"item":"a","verdict":"concede"}]}}'
          echo "validator self-test passed"

  knock:
    if: github.event_name == 'repository_dispatch' || inputs.knock != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Validate the knock
        id: v
        env:
          KNOCK: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.knock }}
        run: |
          # Tag the knock with the channel it actually arrived on, so Art. 7's
          # reply_to requirement applies on the real path and not just in tests.
          # A caller cannot spoof this by declaring its own channel.
          CH='${{ github.event_name == 'repository_dispatch' && 'repository_dispatch' || 'issue' }}'
          echo "$KNOCK" | jq --arg ch "$CH" '. + {channel: $ch}' > knock.json
          {
            echo "### A knock at the front door"
            echo '```json'; cat knock.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Capture the validator's own status. Do NOT pipe into tee here: a
          # pipeline reports the LAST command's status, so `validate | tee` always
          # succeeds and every knock would be admitted unchecked.
          set +e
          node protocol/validate.mjs knock.json > result.txt 2>&1
          rc=$?
          set -e
          cat result.txt
          if [ "$rc" -eq 0 ]; then
            echo "admissible=true" >> "$GITHUB_OUTPUT"
          else
            echo "admissible=false" >> "$GITHUB_OUTPUT"
          fi
          { echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse, with a reason (Art. 8)
        if: steps.v.outputs.admissible == 'false'
        run: |
          echo "Refused. A refused knock may not be retried unchanged." >> "$GITHUB_STEP_SUMMARY"
          exit 1
